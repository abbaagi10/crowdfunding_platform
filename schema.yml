      - reference
      - status
      - transaction_type
      - updated_at
      - wallet
      - wallet_user_email
    TransactionStatusEnum:
      enum:
      - PENDING
      - COMPLETED
      - FAILED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - En attente
        * `COMPLETED` - Terminee
        * `FAILED` - Echouee
        * `CANCELLED` - Annulee
    TransactionTypeEnum:
      enum:
      - DEPOSIT
      - WITHDRAWAL
      - INVESTMENT
      - REFUND
      - INTEREST
      - COMMISSION
      type: string
      description: |-
        * `DEPOSIT` - Depot
        * `WITHDRAWAL` - Retrait
        * `INVESTMENT` - Investissement
        * `REFUND` - Remboursement
        * `INTEREST` - Interet
        * `COMMISSION` - Commission
    User:
      type: object
      description: |-
        Serializer utilisé pour AFFICHER les informations d'un utilisateur.
        Ne contient jamais le mot de passe (jamais dans 'fields').
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Adresse email
          description: Utilisé comme identifiant de connexion.
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Rôle
        is_email_verified:
          type: boolean
          title: Email vérifié
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
    VerificationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - En attente de vérification
        * `APPROVED` - Vérifié
        * `REJECTED` - Rejeté
    Wallet:
      type: object
      description: |-
        Serializer de consultation du portefeuille.
        ENTIÈREMENT en lecture seule : aucun champ financier ne doit être
        modifiable directement par une requête utilisateur. Toute opération
        sur le solde passe par des ENDPOINTS D'ACTION dédiés (credit/debit/...),
        jamais par un PATCH générique sur le wallet lui-même.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Utilisateur
        user_email:
          type: string
          format: email
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Solde total
        locked_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Solde bloqué
        available_balance:
          type: number
          format: double
          description: |-
            Solde réellement disponible = solde total - solde bloqué.
            Propriété calculée, JAMAIS stockée : elle ne peut donc jamais
            être désynchronisée du reste des données (pas de risque d'incohérence).
          readOnly: true
        currency:
          type: string
          readOnly: true
          title: Devise
          description: Code ISO 4217 (EUR, USD...). Une seule devise gérée pour l'instant.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_balance
      - balance
      - created_at
      - currency
      - id
      - locked_balance
      - updated_at
      - user
      - user_email
    WalletHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/MovementTypeEnum'
          readOnly: true
          title: Type de mouvement
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant du mouvement
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Solde après mouvement
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_after
      - created_at
      - description
      - id
      - movement_type
    WithdrawRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
      required:
      - amount
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
