      - id
      - interest_rate
      - number_of_installments
      - project
      - project_title
      - status
      - total_amount
      - total_capital
      - total_interest
      - updated_at
    RepaymentPlanStatusEnum:
      enum:
      - DRAFT
      - ACTIVE
      - COMPLETED
      - DEFAULTED
      type: string
      description: |-
        * `DRAFT` - Brouillon
        * `ACTIVE` - Actif
        * `COMPLETED` - Termine
        * `DEFAULTED` - En defaut
    RepaymentStatusEnum:
      enum:
      - SCHEDULED
      - PAID
      - LATE
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - Planifiee
        * `PAID` - Payee
        * `LATE` - En retard
        * `CANCELLED` - Annulee
    RoleEnum:
      enum:
      - SUPERADMIN
      - USERADMIN
      - ENTREPRISE
      - INVESTISSEUR
      type: string
      description: |-
        * `SUPERADMIN` - Super Administrateur
        * `USERADMIN` - Administrateur
        * `ENTREPRISE` - Entreprise
        * `INVESTISSEUR` - Investisseur
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          format: uuid
          readOnly: true
        wallet:
          type: integer
          readOnly: true
          title: Portefeuille
        wallet_user_email:
          type: string
          format: email
          readOnly: true
        transaction_type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          readOnly: true
          title: Type de transaction
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant
        status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatusEnum'
          readOnly: true
          title: Statut
        project:
          type: integer
          readOnly: true
          nullable: true
          title: Projet concerne
        project_title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
          title: Raison de l'echec
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
