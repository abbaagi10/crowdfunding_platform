    ProjectStatusEnum:
      enum:
      - DRAFT
      - PENDING
      - NEEDS_CORRECTION
      - APPROVED
      - REJECTED
      - ACTIVE
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Brouillon
        * `PENDING` - En attente de validation
        * `NEEDS_CORRECTION` - Corrections demandées
        * `APPROVED` - Approuvé
        * `REJECTED` - Refusé
        * `ACTIVE` - Actif (collecte en cours)
        * `COMPLETED` - Terminé
        * `CANCELLED` - Annulé
    Register:
      type: object
      description: |-
        Serializer pour l'inscription d'un nouvel utilisateur.
        Gère la validation du mot de passe et la confirmation.
      properties:
        email:
          type: string
          format: email
          title: Adresse email
          description: Utilisé comme identifiant de connexion.
          maxLength: 254
        password:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
          title: Confirmation du mot de passe
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Rôle
      required:
      - email
      - password
      - password2
    Repayment:
      type: object
      description: Serializer de CONSULTATION uniquement.
      properties:
        id:
          type: integer
          readOnly: true
        plan:
          type: integer
          readOnly: true
          title: Plan de remboursement
        investment:
          type: integer
          readOnly: true
          title: Investissement concerne
        investor_email:
          type: string
          format: email
          readOnly: true
        project_title:
          type: string
          readOnly: true
        installment_number:
          type: integer
          readOnly: true
          title: Numero d'echeance
        due_date:
          type: string
          format: date
          readOnly: true
          title: Date d'exigibilite
        capital_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Part de capital
        interest_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Part d'interets
        total_amount:
          type: number
          format: double
          description: Montant total de CETTE echeance (capital + interets), pour
            CET investisseur.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RepaymentStatusEnum'
          readOnly: true
          title: Statut
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Date de paiement effectif
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - capital_amount
      - created_at
      - due_date
      - id
      - installment_number
      - interest_amount
      - investment
      - investor_email
      - paid_at
      - plan
      - project_title
      - status
      - total_amount
    RepaymentPlan:
      type: object
