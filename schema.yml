openapi: 3.0.3
info:
  title: Crowdfunding Platform API
  version: 1.0.0
  description: 'API REST complete pour une plateforme de crowdfunding : authentification
    JWT, profils KYC/KYB, projets, investissements, wallets, transactions et remboursements.'
paths:
  /api/v1/accounts/activate/{uidb64}/{token}/:
    get:
      operationId: accounts_activate_retrieve
      description: |-
        Endpoint d'activation de compte (GET /api/v1/accounts/activate/<uidb64>/<token>/).
        Active le compte d'un utilisateur à partir du lien reçu par email.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      - in: path
        name: uidb64
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Compte activé avec succès.
  /api/v1/accounts/login/:
    post:
      operationId: accounts_login_create
      description: |-
        Vue de connexion personnalisée (POST /api/v1/accounts/login/).
        Utilise CustomTokenObtainPairSerializer, qui vérifie en plus
        que le compte a bien été activé (is_email_verified=True)
        avant d'autoriser la connexion.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/v1/accounts/login/refresh/:
    post:
      operationId: accounts_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: |-
        Endpoint de déconnexion (POST /api/v1/accounts/logout/).
        Ajoute le refresh token fourni à la blacklist, le rendant inutilisable.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Déconnexion réussie.
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: |-
        Endpoint de profil (GET /api/v1/accounts/me/).
        Retourne les informations de l'utilisateur actuellement authentifié.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/password-reset/:
    post:
      operationId: accounts_password_reset_create
      description: |-
        Endpoint de demande de réinitialisation (POST /api/v1/accounts/password-reset/).
        Envoie un email contenant un lien de réinitialisation SI l'email existe.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Email de réinitialisation envoyé si le compte existe.
  /api/v1/accounts/password-reset/confirm/:
    post:
      operationId: accounts_password_reset_confirm_create
      description: |-
        Endpoint de confirmation (POST /api/v1/accounts/password-reset/confirm/).
        Définit le nouveau mot de passe si le token est valide.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Mot de passe réinitialisé avec succès.
  /api/v1/accounts/register/:
    post:
      operationId: accounts_register_create
      description: |-
        Endpoint d'inscription (POST /api/v1/accounts/register/).
        Crée un utilisateur et retourne directement une paire de tokens JWT (auto-login).
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/accounts/users/:
    get:
      operationId: accounts_users_list
      description: |-
        Endpoint de listing des utilisateurs (GET /api/v1/accounts/users/).
        Réservé aux membres de l'administration (UserAdmin, SuperAdmin).
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/v1/companies/profile/me/:
    get:
      operationId: companies_profile_me_retrieve
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/companies/profile/me/
        Permet à l'entreprise connectée de consulter et modifier SON PROPRE profil.

        Contrairement à InvestorProfile, on ne peut PAS utiliser get_or_create ici
        sans argument supplémentaire : company_name et registration_number sont
        des champs obligatoires (pas de valeur par défaut sensée). Le profil doit
        donc être créé explicitement via un POST, pas silencieusement au premier GET.
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
    put:
      operationId: companies_profile_me_update
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/companies/profile/me/
        Permet à l'entreprise connectée de consulter et modifier SON PROPRE profil.

        Contrairement à InvestorProfile, on ne peut PAS utiliser get_or_create ici
        sans argument supplémentaire : company_name et registration_number sont
        des champs obligatoires (pas de valeur par défaut sensée). Le profil doit
        donc être créé explicitement via un POST, pas silencieusement au premier GET.
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
    patch:
      operationId: companies_profile_me_partial_update
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/companies/profile/me/
        Permet à l'entreprise connectée de consulter et modifier SON PROPRE profil.

        Contrairement à InvestorProfile, on ne peut PAS utiliser get_or_create ici
        sans argument supplémentaire : company_name et registration_number sont
        des champs obligatoires (pas de valeur par défaut sensée). Le profil doit
        donc être créé explicitement via un POST, pas silencieusement au premier GET.
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
  /api/v1/companies/profiles/:
    get:
      operationId: companies_profiles_list
      description: |-
        Endpoint GET /api/v1/companies/profiles/
        Réservé à l'administration : liste tous les profils entreprises.
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyProfile'
          description: ''
  /api/v1/companies/profiles/{id}/:
    get:
      operationId: companies_profiles_retrieve
      description: |-
        Endpoint GET /api/v1/companies/profiles/<id>/
        Consultation d'un profil précis : propriétaire OU admin uniquement.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
  /api/v1/companies/profiles/{id}/verify/:
    patch:
      operationId: companies_profiles_verify_partial_update
      description: |-
        Endpoint PATCH /api/v1/companies/profiles/<id>/verify/
        Réservé à l'administration : approuve ou rejette un dossier KYB.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfileAdminUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfileAdminUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfileAdminUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
  /api/v1/investments/:
    get:
      operationId: investments_list
      description: |-
        Endpoint GET /api/v1/investments/
        Reserve a l'administration : audit global de TOUS les investissements.
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Investment'
          description: ''
  /api/v1/investments/me/:
    get:
      operationId: investments_me_list
      description: |-
        Endpoint GET /api/v1/investments/me/
        Le "portefeuille" de l'investisseur connecte : tous ses investissements,
        tous projets confondus, du plus recent au plus ancien.
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Investment'
          description: ''
  /api/v1/investments/me/summary/:
    get:
      operationId: investments_me_summary_retrieve
      description: |-
        Endpoint GET /api/v1/investments/me/summary/
        Resume agrege du portefeuille : total investi, nombre de projets distincts,
        total encore actif (non rembourse). Utile pour un tableau de bord investisseur.
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          description: 'Résumé agrégé : total_invested, total_remaining, projects_count'
  /api/v1/investments/project/{project_id}/:
    get:
      operationId: investments_project_list
      description: |-
        Endpoint GET /api/v1/investments/project/<project_id>/
        Reserve a l'administration ET a l'entreprise proprietaire du projet :
        liste de tous les investissements recus par CE projet precis.
        Utile pour qu'une entreprise suive qui a investi dans SA campagne.
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - investments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Investment'
          description: ''
  /api/v1/investors/profile/me/:
    get:
      operationId: investors_profile_me_retrieve
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/investors/profile/me/
        Permet à l'investisseur connecté de consulter et modifier SON PROPRE profil.
        Ne nécessite aucun paramètre d'ID dans l'URL : get_object() retourne
        toujours le profil lié à request.user.
      tags:
      - investors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorProfile'
          description: ''
    put:
      operationId: investors_profile_me_update
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/investors/profile/me/
        Permet à l'investisseur connecté de consulter et modifier SON PROPRE profil.
        Ne nécessite aucun paramètre d'ID dans l'URL : get_object() retourne
        toujours le profil lié à request.user.
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvestorProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvestorProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorProfile'
          description: ''
    patch:
      operationId: investors_profile_me_partial_update
      description: |-
        Endpoint GET/PUT/PATCH /api/v1/investors/profile/me/
        Permet à l'investisseur connecté de consulter et modifier SON PROPRE profil.
        Ne nécessite aucun paramètre d'ID dans l'URL : get_object() retourne
        toujours le profil lié à request.user.
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorProfile'
          description: ''
  /api/v1/investors/profiles/:
    get:
      operationId: investors_profiles_list
      description: |-
        Endpoint GET /api/v1/investors/profiles/
        Réservé à l'administration : liste tous les profils investisseurs,
        utile pour la revue des dossiers KYC.
      tags:
      - investors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestorProfile'
          description: ''
  /api/v1/investors/profiles/{id}/:
    get:
      operationId: investors_profiles_retrieve
      description: |-
        Endpoint GET /api/v1/investors/profiles/<id>/
        Consultation d'un profil précis par son ID.
        Autorisé pour : le propriétaire du profil OU un admin (IsProfileOwnerOrAdmin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - investors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorProfile'
          description: ''
  /api/v1/investors/profiles/{id}/verify/:
    patch:
      operationId: investors_profiles_verify_partial_update
      description: |-
        Endpoint PATCH /api/v1/investors/profiles/<id>/verify/
        Réservé à l'administration : approuve ou rejette un dossier KYC.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfileAdminUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfileAdminUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInvestorProfileAdminUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorProfile'
          description: ''
  /api/v1/projects/categories/:
    get:
      operationId: projects_categories_list
      description: |-
        Endpoint GET /api/v1/projects/categories/
        Liste publique des catégories (nécessaire pour construire un formulaire
        de création de projet côté frontend, par exemple).
      tags:
      - projects
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/projects/projects/:
    get:
      operationId: projects_projects_list
      description: |-
        Endpoint GET/POST /api/v1/projects/projects/

        GET : liste des projets, filtrée selon le rôle de l'utilisateur :
            - Investisseur / non-authentifié : uniquement les projets ACTIFS (publics)
            - Entreprise : ses propres projets (tous statuts confondus)
            - Admin : tous les projets, tous statuts

        POST : création d'un nouveau projet, réservée aux Entreprises (IsEntrepriseRole).
      tags:
      - projects
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_projects_create
      description: |-
        Endpoint GET/POST /api/v1/projects/projects/

        GET : liste des projets, filtrée selon le rôle de l'utilisateur :
            - Investisseur / non-authentifié : uniquement les projets ACTIFS (publics)
            - Entreprise : ses propres projets (tous statuts confondus)
            - Admin : tous les projets, tous statuts

        POST : création d'un nouveau projet, réservée aux Entreprises (IsEntrepriseRole).
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/projects/{id}/:
    get:
      operationId: projects_projects_retrieve
      description: |-
        Endpoint GET/PUT/PATCH/DELETE /api/v1/projects/projects/<id>/
        Consultation libre (si le projet est public), modification/suppression
        réservée au propriétaire ou à l'administration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_projects_update
      description: |-
        Endpoint GET/PUT/PATCH/DELETE /api/v1/projects/projects/<id>/
        Consultation libre (si le projet est public), modification/suppression
        réservée au propriétaire ou à l'administration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_projects_partial_update
      description: |-
        Endpoint GET/PUT/PATCH/DELETE /api/v1/projects/projects/<id>/
        Consultation libre (si le projet est public), modification/suppression
        réservée au propriétaire ou à l'administration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_projects_destroy
      description: |-
        Endpoint GET/PUT/PATCH/DELETE /api/v1/projects/projects/<id>/
        Consultation libre (si le projet est public), modification/suppression
        réservée au propriétaire ou à l'administration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/projects/projects/{id}/moderate/:
    patch:
      operationId: projects_projects_moderate_partial_update
      description: |-
        Endpoint PATCH /api/v1/projects/projects/<id>/moderate/
        Réservé à l'administration : Valider / Refuser / Demander correction.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectModeration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectModeration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectModeration'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/projects/{id}/submit/:
    post:
      operationId: projects_projects_submit_create
      description: |-
        Endpoint POST /api/v1/projects/projects/<id>/submit/
        Permet à l'entreprise propriétaire de soumettre son projet (DRAFT -> PENDING)
        pour validation par l'administration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/repayments/{id}/pay/:
    post:
      operationId: repayments_pay_create
      description: |-
        Endpoint POST /api/v1/repayments/<id>/pay/
        Reserve a l'administration : declenche le paiement REEL d'une echeance
        (simule ici -- en production, ce serait typiquement automatise par
        une tache planifiee verifiant les due_date, hors scope de cette etape).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - repayments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repayment'
          description: ''
  /api/v1/repayments/me/:
    get:
      operationId: repayments_me_list
      description: |-
        Endpoint GET /api/v1/repayments/me/
        Toutes les echeances (passees et a venir) de l'investisseur connecte,
        tous projets confondus -- son "calendrier de remboursements".
      tags:
      - repayments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repayment'
          description: ''
  /api/v1/repayments/plans/generate/{project_id}/:
    post:
      operationId: repayments_plans_generate_create
      description: |-
        Endpoint POST /api/v1/repayments/plans/generate/<project_id>/
        Reserve a l'administration : genere le plan de remboursement d'un projet.
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - repayments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeneratePlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeneratePlanRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentPlan'
          description: ''
  /api/v1/repayments/plans/project/{project_id}/:
    get:
      operationId: repayments_plans_project_retrieve
      description: |-
        Endpoint GET /api/v1/repayments/plans/project/<project_id>/
        Consultation du plan de remboursement d'un projet : accessible a
        l'entreprise proprietaire, aux investisseurs ayant investi dans ce
        projet, et a l'administration.
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - repayments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentPlan'
          description: ''
  /api/v1/transactions/:
    get:
      operationId: transactions_list
      description: |-
        Endpoint GET /api/v1/transactions/
        Reserve a l'administration : vue d'audit de TOUTES les transactions.
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/transactions/deposit/:
    post:
      operationId: transactions_deposit_create
      description: |-
        Endpoint POST /api/v1/transactions/deposit/
        Simule un depot de fonds sur le wallet de l'utilisateur connecte.
        (Integration reelle d'un prestataire de paiement -- hors scope ici.)
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepositRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepositRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/transactions/invest/:
    post:
      operationId: transactions_invest_create
      description: |-
        Endpoint POST /api/v1/transactions/invest/
        Un investisseur investit dans un projet.
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/transactions/me/:
    get:
      operationId: transactions_me_list
      description: |-
        Endpoint GET /api/v1/transactions/me/
        Historique des transactions de l'utilisateur connecte.
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/transactions/withdraw/:
    post:
      operationId: transactions_withdraw_create
      description: |-
        Endpoint POST /api/v1/transactions/withdraw/
        Simule un retrait de fonds depuis le wallet de l'utilisateur connecte.
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/v1/wallets/wallet/me/:
    get:
      operationId: wallets_wallet_me_retrieve
      description: |-
        Endpoint GET /api/v1/wallets/wallet/me/
        Consultation du PROPRE portefeuille de l'utilisateur connecté.
      tags:
      - wallets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/v1/wallets/wallet/me/history/:
    get:
      operationId: wallets_wallet_me_history_list
      description: |-
        Endpoint GET /api/v1/wallets/wallet/me/history/
        Historique complet des mouvements du portefeuille de l'utilisateur connecté.
      tags:
      - wallets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletHistory'
          description: ''
  /api/v1/wallets/wallets/:
    get:
      operationId: wallets_wallets_list
      description: |-
        Endpoint GET /api/v1/wallets/wallets/
        Reserve a l'administration : liste TOUS les portefeuilles, pour l'audit.
        STRICTEMENT en lecture -- aucune methode d'ecriture n'est exposee ici,
        volontairement (voir justification dans la documentation de l'etape).
      tags:
      - wallets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
          description: ''
  /api/v1/wallets/wallets/{id}/:
    get:
      operationId: wallets_wallets_retrieve
      description: |-
        Endpoint GET /api/v1/wallets/wallets/<id>/
        Reserve a l'administration : consultation d'UN portefeuille precis.
        RetrieveAPIView expose UNIQUEMENT le GET -- aucun risque de modification
        accidentelle via cette vue (pas de mixin update/destroy).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - wallets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/v1/wallets/wallets/{id}/history/:
    get:
      operationId: wallets_wallets_history_list
      description: |-
        Endpoint GET /api/v1/wallets/wallets/<id>/history/
        Reserve a l'administration : historique complet d'UN portefeuille precis,
        pour l'audit d'un utilisateur en particulier (ex: en cas de litige).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - wallets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletHistory'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 100
        description:
          type: string
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    CompanyProfile:
      type: object
      description: |-
        Serializer complet du profil entreprise.
        Utilisé pour la consultation ET la modification par le propriétaire.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Utilisateur
        user_email:
          type: string
          format: email
          readOnly: true
        company_name:
          type: string
          title: Raison sociale
          maxLength: 255
        registration_number:
          type: string
          title: Numéro d'enregistrement légal
          maxLength: 50
        company_type:
          type: string
          title: Forme juridique
          description: 'Ex: SARL, SAS, SA...'
          maxLength: 100
        industry_sector:
          type: string
          title: Secteur d'activité
          maxLength: 100
        website:
          title: Site web
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        legal_representative_name:
          type: string
          title: Nom du représentant légal
          maxLength: 255
        legal_representative_position:
          type: string
          title: Fonction du représentant légal
          maxLength: 100
        legal_representative_phone:
          type: string
          title: Téléphone du représentant légal
          maxLength: 20
        address_line:
          type: string
          title: Adresse
          maxLength: 255
        city:
          type: string
          title: Ville
          maxLength: 100
        postal_code:
          type: string
          title: Code postal
          maxLength: 20
        country:
          type: string
          title: Pays
          maxLength: 100
        iban:
          oneOf:
          - type: string
            pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
            maxLength: 34
          - type: string
            maxLength: 0
        bic_swift:
          type: string
          title: Code BIC/SWIFT
          maxLength: 11
        bank_name:
          type: string
          title: Nom de la banque
          maxLength: 255
        company_logo:
          type: string
          format: uri
          nullable: true
          title: Logo de l'entreprise
        registration_document:
          type: string
          format: uri
          nullable: true
          title: Extrait d'immatriculation (Kbis ou équivalent)
        legal_representative_id_document:
          type: string
          format: uri
          nullable: true
          title: Pièce d'identité du représentant légal
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
          title: Statut de vérification
        rejection_reason:
          type: string
          readOnly: true
          title: Motif de rejet
        is_kyb_complete:
          type: boolean
          description: |-
            Vérifie si les documents essentiels du dossier KYB ont été fournis.
            Utilisé dans l'étape future (module Projet) pour bloquer la création
            d'un projet de collecte tant que l'entreprise n'est pas vérifiée.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_name
      - created_at
      - id
      - is_kyb_complete
      - registration_number
      - rejection_reason
      - updated_at
      - user
      - user_email
      - verification_status
    CustomTokenObtainPair:
      type: object
      description: |-
        Surcharge du serializer de connexion JWT standard.
        Ajoute une vérification supplémentaire : le compte doit être activé (email vérifié)
        avant de pouvoir se connecter.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DepositRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
      required:
      - amount
    GeneratePlanRequest:
      type: object
      description: Valide les parametres d'entree pour generer un plan -- ne cree
        rien directement.
      properties:
        interest_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        number_of_installments:
          type: integer
          minimum: 1
        frequency_days:
          type: integer
          minimum: 1
          default: 30
      required:
      - interest_rate
      - number_of_installments
    InvestRequest:
      type: object
      properties:
        project_id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
      - project_id
    Investment:
      type: object
      description: |-
        Serializer de CONSULTATION uniquement -- un Investment ne se cree
        jamais directement via l'API, toujours via TransactionService.invest().
      properties:
        id:
          type: integer
          readOnly: true
        investor_profile:
          type: integer
          readOnly: true
          title: Profil investisseur
        investor_email:
          type: string
          format: email
          readOnly: true
        project:
          type: integer
          readOnly: true
          title: Projet
        project_title:
          type: string
          readOnly: true
        project_status:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        transaction:
          type: integer
          readOnly: true
          title: Transaction d'origine
        transaction_reference:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant investi
        amount_refunded:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant deja rembourse
        remaining_amount:
          type: number
          format: double
          description: Montant encore non rembourse sur cet investissement (utilise
            a l'Etape 10).
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvestmentStatusEnum'
          readOnly: true
          title: Statut
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - amount_refunded
      - company_name
      - created_at
      - id
      - investor_email
      - investor_profile
      - project
      - project_status
      - project_title
      - remaining_amount
      - status
      - transaction
      - transaction_reference
      - updated_at
    InvestmentStatusEnum:
      enum:
      - ACTIVE
      - REFUNDED
      - PARTIALLY_REFUNDED
      type: string
      description: |-
        * `ACTIVE` - Actif
        * `REFUNDED` - Rembourse
        * `PARTIALLY_REFUNDED` - Partiellement rembourse
    InvestorProfile:
      type: object
      description: |-
        Serializer complet du profil investisseur.
        Utilisé pour la consultation ET la modification par le propriétaire.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Utilisateur
        user_email:
          type: string
          format: email
          readOnly: true
        date_of_birth:
          type: string
          format: date
          nullable: true
          title: Date de naissance
        nationality:
          type: string
          title: Nationalité
          maxLength: 100
        phone_number:
          type: string
          title: Numéro de téléphone
          maxLength: 20
        address_line:
          type: string
          title: Adresse
          maxLength: 255
        city:
          type: string
          title: Ville
          maxLength: 100
        postal_code:
          type: string
          title: Code postal
          maxLength: 20
        country:
          type: string
          title: Pays
          maxLength: 100
        profile_photo:
          type: string
          format: uri
          nullable: true
          title: Photo de profil
        identity_document:
          type: string
          format: uri
          nullable: true
          title: Pièce d'identité
        proof_of_address:
          type: string
          format: uri
          nullable: true
          title: Justificatif de domicile
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
          title: Statut de vérification
        rejection_reason:
          type: string
          readOnly: true
          title: Motif de rejet
        is_kyc_complete:
          type: boolean
          description: |-
            Propriété calculée (pas stockée en base) qui vérifie si les documents
            essentiels ont été fournis. Utile pour bloquer un investissement
            tant que le KYC n'est pas complet (étape future : module Investment).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_kyc_complete
      - rejection_reason
      - updated_at
      - user
      - user_email
      - verification_status
    MovementTypeEnum:
      enum:
      - CREDIT
      - DEBIT
      - LOCK
      - UNLOCK
      type: string
      description: |-
        * `CREDIT` - Crédit
        * `DEBIT` - Débit
        * `LOCK` - Blocage de fonds
        * `UNLOCK` - Déblocage de fonds
    PasswordResetConfirm:
      type: object
      description: Valide le uid, le token et le nouveau mot de passe lors de la confirmation.
      properties:
