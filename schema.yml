        total_interest:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Total des interets
        total_amount:
          type: number
          format: double
          description: Montant total a rembourser, capital + interets confondus.
          readOnly: true
        status:
